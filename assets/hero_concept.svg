<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="'Segoe UI',Roboto,system-ui,-apple-system,sans-serif">
  <rect width="1200" height="440" rx="20" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="438" rx="19" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- Title -->
  <text x="60" y="92" font-size="52" font-weight="700" fill="#e6edf3">MesoNet · Deepfake Detection</text>
  <rect x="62" y="112" width="132" height="5" rx="2.5" fill="#1f6feb"/>
  <text x="60" y="158" font-size="23" fill="#8b949e">Reproducing a compact 2018 deepfake detector — and probing where it breaks.</text>

  <!-- tags -->
  <g font-size="15" font-weight="600">
    <rect x="60" y="182" width="120" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
    <text x="120" y="202" fill="#58a6ff" text-anchor="middle">PyTorch</text>
    <rect x="190" y="182" width="176" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
    <text x="278" y="202" fill="#3fb950" text-anchor="middle">Apple-Silicon · MPS</text>
    <rect x="376" y="182" width="200" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
    <text x="476" y="202" fill="#d29922" text-anchor="middle">FaceForensics++ · c23</text>
  </g>

  <!-- Flow -->
  <g transform="translate(0,296)">
    <!-- Real face card -->
    <rect x="60" y="0" width="150" height="110" rx="12" fill="#0f1620" stroke="#2da44e" stroke-width="2"/>
    <circle cx="135" cy="46" r="26" fill="none" stroke="#3fb950" stroke-width="2.5"/>
    <circle cx="126" cy="42" r="3.5" fill="#3fb950"/><circle cx="144" cy="42" r="3.5" fill="#3fb950"/>
    <path d="M124 55 q11 9 22 0" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round"/>
    <text x="135" y="98" font-size="15" font-weight="600" fill="#3fb950" text-anchor="middle">Real</text>

    <!-- Fake face card -->
    <rect x="60" y="130" width="150" height="110" rx="12" fill="#0f1620" stroke="#cf222e" stroke-width="2"/>
    <circle cx="135" cy="176" r="26" fill="none" stroke="#f85149" stroke-width="2.5"/>
    <circle cx="126" cy="172" r="3.5" fill="#f85149"/><circle cx="144" cy="172" r="3.5" fill="#f85149"/>
    <path d="M124 189 q11 9 22 0" fill="none" stroke="#f85149" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M112 150 l46 0" stroke="#f85149" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8"/>
    <text x="135" y="228" font-size="15" font-weight="600" fill="#f85149" text-anchor="middle">Deepfake</text>

    <!-- arrow 1 -->
    <path d="M226 120 L300 120" stroke="#8b949e" stroke-width="2.5" marker-end="url(#ah)"/>

    <!-- CNN chip -->
    <rect x="312" y="58" width="250" height="124" rx="14" fill="#0d2233" stroke="#1f6feb" stroke-width="2"/>
    <text x="437" y="98" font-size="20" font-weight="700" fill="#58a6ff" text-anchor="middle">MesoNet</text>
    <text x="437" y="124" font-size="14" fill="#8b949e" text-anchor="middle">tiny CNN · ~28,000</text>
    <text x="437" y="143" font-size="14" fill="#8b949e" text-anchor="middle">parameters</text>
    <g stroke="#1f6feb" stroke-width="1.6" opacity="0.85">
      <line x1="356" y1="160" x2="380" y2="170"/><line x1="380" y1="170" x2="404" y2="160"/>
      <line x1="404" y1="160" x2="428" y2="170"/><line x1="428" y1="170" x2="452" y2="160"/>
      <line x1="452" y1="160" x2="476" y2="170"/><line x1="476" y1="170" x2="500" y2="160"/>
    </g>

    <!-- arrow 2 -->
    <path d="M574 120 L648 120" stroke="#8b949e" stroke-width="2.5" marker-end="url(#ah)"/>

    <!-- verdict -->
    <rect x="660" y="72" width="200" height="42" rx="10" fill="#0f1f14" stroke="#2da44e" stroke-width="2"/>
    <text x="690" y="99" font-size="17" font-weight="700" fill="#3fb950">✓  Real</text>
    <rect x="660" y="126" width="200" height="42" rx="10" fill="#210f10" stroke="#cf222e" stroke-width="2"/>
    <text x="690" y="153" font-size="17" font-weight="700" fill="#f85149">✕  Fake</text>

    <!-- caption -->
    <text x="892" y="108" font-size="16" fill="#8b949e">Looks at a face and</text>
    <text x="892" y="132" font-size="16" fill="#8b949e">decides: genuine or</text>
    <text x="892" y="156" font-size="16" fill="#8b949e">manipulated?</text>
  </g>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#8b949e"/>
    </marker>
  </defs>
</svg>
