<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Segoe UI',Roboto,system-ui,-apple-system,sans-serif">
  <rect width="1200" height="560" rx="20" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="558" rx="19" fill="none" stroke="#d0d7de" stroke-width="2"/>

  <!-- Title -->
  <text x="60" y="92" font-size="52" font-weight="700" fill="#1f2328">MesoNet · Deepfake Detection</text>
  <rect x="62" y="112" width="132" height="5" rx="2.5" fill="#1f6feb"/>
  <text x="60" y="158" font-size="23" fill="#57606a">Reproducing a compact 2018 deepfake detector — and probing where it breaks.</text>

  <!-- tags -->
  <g font-size="15" font-weight="600">
    <rect x="60" y="182" width="120" height="30" rx="15" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="120" y="202" fill="#0969da" text-anchor="middle">PyTorch</text>
    <rect x="190" y="182" width="176" height="30" rx="15" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="278" y="202" fill="#1a7f37" text-anchor="middle">Apple-Silicon · MPS</text>
    <rect x="376" y="182" width="200" height="30" rx="15" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="476" y="202" fill="#9a6700" text-anchor="middle">FaceForensics++ · c23</text>
  </g>

  <!-- Flow -->
  <g transform="translate(0,296)">
    <!-- Real face card -->
    <rect x="60" y="0" width="150" height="110" rx="12" fill="#f6f8fa" stroke="#2da44e" stroke-width="2"/>
    <circle cx="135" cy="46" r="26" fill="none" stroke="#2da44e" stroke-width="2.5"/>
    <circle cx="126" cy="42" r="3.5" fill="#2da44e"/><circle cx="144" cy="42" r="3.5" fill="#2da44e"/>
    <path d="M124 55 q11 9 22 0" fill="none" stroke="#2da44e" stroke-width="2.5" stroke-linecap="round"/>
    <text x="135" y="98" font-size="15" font-weight="600" fill="#1a7f37" text-anchor="middle">Real</text>

    <!-- Fake face card -->
    <rect x="60" y="130" width="150" height="110" rx="12" fill="#f6f8fa" stroke="#cf222e" stroke-width="2"/>
    <circle cx="135" cy="176" r="26" fill="none" stroke="#cf222e" stroke-width="2.5"/>
    <circle cx="126" cy="172" r="3.5" fill="#cf222e"/><circle cx="144" cy="172" r="3.5" fill="#cf222e"/>
    <path d="M124 189 q11 9 22 0" fill="none" stroke="#cf222e" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M112 150 l46 0" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8"/>
    <text x="135" y="228" font-size="15" font-weight="600" fill="#cf222e" text-anchor="middle">Deepfake</text>

    <!-- arrow 1 -->
    <path d="M226 120 L300 120" stroke="#57606a" stroke-width="2.5" marker-end="url(#ah)"/>

    <!-- CNN chip -->
    <rect x="312" y="58" width="250" height="124" rx="14" fill="#ddf4ff" stroke="#1f6feb" stroke-width="2"/>
    <text x="437" y="98" font-size="20" font-weight="700" fill="#0969da" text-anchor="middle">MesoNet</text>
    <text x="437" y="124" font-size="14" fill="#57606a" text-anchor="middle">tiny CNN · ~28,000</text>
    <text x="437" y="143" font-size="14" fill="#57606a" text-anchor="middle">parameters</text>
    <g stroke="#1f6feb" stroke-width="1.6" opacity="0.85">
      <line x1="356" y1="160" x2="380" y2="170"/><line x1="380" y1="170" x2="404" y2="160"/>
      <line x1="404" y1="160" x2="428" y2="170"/><line x1="428" y1="170" x2="452" y2="160"/>
      <line x1="452" y1="160" x2="476" y2="170"/><line x1="476" y1="170" x2="500" y2="160"/>
    </g>

    <!-- arrow 2 -->
    <path d="M574 120 L648 120" stroke="#57606a" stroke-width="2.5" marker-end="url(#ah)"/>

    <!-- verdict -->
    <rect x="660" y="72" width="200" height="42" rx="10" fill="#dafbe1" stroke="#2da44e" stroke-width="2"/>
    <text x="690" y="99" font-size="17" font-weight="700" fill="#1a7f37">✓  Real</text>
    <rect x="660" y="126" width="200" height="42" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
    <text x="690" y="153" font-size="17" font-weight="700" fill="#cf222e">✕  Fake</text>

    <!-- caption -->
    <text x="892" y="108" font-size="16" fill="#57606a">Looks at a face and</text>
    <text x="892" y="132" font-size="16" fill="#57606a">decides: genuine or</text>
    <text x="892" y="156" font-size="16" fill="#57606a">manipulated?</text>
  </g>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#57606a"/>
    </marker>
  </defs>
</svg>
