<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" font-family="'Segoe UI',Roboto,system-ui,-apple-system,sans-serif">
  <rect width="1180" height="300" rx="16" fill="#ffffff"/>
  <rect x="1" y="1" width="1178" height="298" rx="15" fill="none" stroke="#d0d7de" stroke-width="2"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#1f2328">How it works — from video to verdict</text>

  <g transform="translate(0,96)">
    <!-- Step 1: video -->
    <rect x="40" y="20" width="180" height="120" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="70" y="46" width="120" height="70" rx="6" fill="#eaeef2" stroke="#afb8c1"/>
    <path d="M112 64 l26 16 l-26 16 z" fill="#57606a"/>
    <text x="130" y="132" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Video frames</text>

    <path d="M228 80 L276 80" stroke="#8c959f" stroke-width="2.5" marker-end="url(#p)"/>

    <!-- Step 2: face crop -->
    <rect x="284" y="20" width="180" height="120" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="333" y="42" width="82" height="82" rx="6" fill="none" stroke="#1f6feb" stroke-width="2" stroke-dasharray="5 4"/>
    <circle cx="374" cy="80" r="24" fill="none" stroke="#57606a" stroke-width="2"/>
    <circle cx="366" cy="76" r="3" fill="#57606a"/><circle cx="382" cy="76" r="3" fill="#57606a"/>
    <path d="M364 90 q10 8 20 0" fill="none" stroke="#57606a" stroke-width="2" stroke-linecap="round"/>
    <text x="374" y="132" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Detect &amp; crop face</text>

    <path d="M472 80 L520 80" stroke="#8c959f" stroke-width="2.5" marker-end="url(#p)"/>

    <!-- Step 3: CNN -->
    <rect x="528" y="20" width="196" height="120" rx="12" fill="#ddf4ff" stroke="#1f6feb" stroke-width="2"/>
    <text x="626" y="62" font-size="18" font-weight="700" fill="#0969da" text-anchor="middle">MesoNet CNN</text>
    <g stroke="#1f6feb" stroke-width="1.5" opacity="0.9">
      <line x1="566" y1="96" x2="592" y2="86"/><line x1="592" y1="86" x2="618" y2="100"/>
      <line x1="618" y1="100" x2="644" y2="86"/><line x1="644" y1="86" x2="670" y2="100"/>
      <line x1="670" y1="100" x2="686" y2="92"/>
    </g>
    <text x="626" y="128" font-size="13" fill="#57606a" text-anchor="middle">4 conv blocks · ~28k params</text>

    <path d="M732 80 L780 80" stroke="#8c959f" stroke-width="2.5" marker-end="url(#p)"/>

    <!-- Step 4: probability -->
    <rect x="788" y="20" width="160" height="120" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="868" y="60" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Fake-ness</text>
    <text x="868" y="80" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">score</text>
    <rect x="808" y="96" width="120" height="14" rx="7" fill="#eaeef2"/>
    <rect x="808" y="96" width="92" height="14" rx="7" fill="#1f6feb"/>
    <text x="868" y="130" font-size="13" fill="#57606a" text-anchor="middle">0.0 – 1.0</text>

    <path d="M956 80 L1000 80" stroke="#8c959f" stroke-width="2.5" marker-end="url(#p)"/>

    <!-- Step 5: verdict -->
    <rect x="1008" y="34" width="132" height="42" rx="9" fill="#dafbe1" stroke="#2da44e" stroke-width="1.8"/>
    <text x="1074" y="61" font-size="15" font-weight="700" fill="#1a7f37" text-anchor="middle">✓ Real</text>
    <rect x="1008" y="86" width="132" height="42" rx="9" fill="#ffebe9" stroke="#cf222e" stroke-width="1.8"/>
    <text x="1074" y="113" font-size="15" font-weight="700" fill="#cf222e" text-anchor="middle">✕ Fake</text>
  </g>

  <defs>
    <marker id="p" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#8c959f"/>
    </marker>
  </defs>
</svg>
